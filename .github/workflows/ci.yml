name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SloMonitoring.sln

      - name: Build
        run: dotnet build SloMonitoring.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SloMonitoring.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Pack
        run: dotnet pack src/SchemaArchitects.AspNetCore.Slo --configuration Release --no-build --output artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*
