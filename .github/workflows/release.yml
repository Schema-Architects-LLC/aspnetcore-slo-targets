name: Release

# Publishes to nuget.org when a version tag is pushed:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Uses nuget.org Trusted Publishing (OIDC): no long-lived API key is stored anywhere.
# Requires:
#   - a Trusted Publishing policy on nuget.org for this repo and workflow file (release.yml)
#   - the repository secret NUGET_USER with your nuget.org profile name (not your email)

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write  # lets the job request a GitHub OIDC token for nuget.org

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore SloMonitoring.sln

      - name: Build
        run: dotnet build SloMonitoring.sln --configuration Release --no-restore -p:Version=$VERSION

      - name: Test
        run: dotnet test SloMonitoring.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/SchemaArchitects.AspNetCore.Slo --configuration Release --no-build -p:Version=$VERSION --output artifacts

      # Exchange the OIDC token for a temporary nuget.org API key (valid 1 hour, requested right before the push)
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        # Pushing the .nupkg also pushes the matching .snupkg (symbols)
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package-${{ env.VERSION }}
          path: artifacts/*
